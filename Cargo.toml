[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ahash = "0.8"
arrow-array = { version = "54", default-features = false }
arrow-schema = { version = "54", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
libc = "0.2"
memchr = "2.7"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
